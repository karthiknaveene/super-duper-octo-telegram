name: tag

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - "*"
jobs:
  run-scheduled-task:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: register-artifact-step-with-options
        uses: cloudbees-io-gha/register-build-artifact@v3
        with:
          cloudbees-url : "https://api.saas-qa.beescloud.com"
          name: Docker-artifact
          url: https://hub.docker.com/repository/docker/hackers
          version: 1.0.2
          label: "Comp-long"
          component-id : "b6aa8e35-6b59-42b9-9569-2358df53d4ba"

      - name: register-artifact-step-with-options - no comp
        uses: cloudbees-io-gha/label-artifact-version@v1
        with:
          cloudbees-url : "https://api.saas-qa.beescloud.com"
          artifact-id : KN-Docker-artifact
          labels: "No comp"
          

  run-scheduled-task-1:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Run some scheduled task
        run: |
          echo "This is a scheduled run every 5 minutes."
